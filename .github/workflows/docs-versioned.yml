name: Versioned Docs Receiver

on:
  repository_dispatch:
    types: [lexos_docs_publish]
  workflow_dispatch:
    inputs:
      operation:
        description: Manual operation
        required: true
        type: choice
        options: [dry-run, backfill, alias-repair, rollback]
      source_ref:
        description: lexos source ref (branch/tag/SHA)
        required: false
        default: main
        type: string
      docs_ref:
        description: docs ref override (branch/tag/SHA)
        required: false
        default: ""
        type: string
      version_label:
        description: version label override
        required: false
        default: ""
        type: string
      target_version:
        description: target version for alias-repair or rollback
        required: false
        default: ""
        type: string
      alias_name:
        description: alias to repair
        required: false
        default: stable
        type: choice
        options: [stable, stable-beta, latest, dev]
      reason:
        description: required reason
        required: true
        type: string
      change_summary:
        description: required impact summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs-receiver-gh-pages
  cancel-in-progress: false

env:
  LEXOS_REPO: scottkleinman/lexos
  DOCS_SOURCE_BRANCH: main
  DEV_VERSION: dev
  STABLE_ALIAS: stable
  PRERELEASE_ALIAS: stable-beta

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Determine publish context
        id: ctx
        shell: bash
        run: |
          set -euo pipefail

          trigger="${{ github.event_name }}"
          operation="dry-run"
          source_ref=""
          docs_ref=""
          version_label=""
          alias_to_update=""
          update_latest_alias="false"
          update_default="false"
          push_to_pages="true"

          if [[ "${trigger}" == "repository_dispatch" ]]; then
            if [[ "${{ github.event.client_payload.source_repository }}" != "${LEXOS_REPO}" ]]; then
              echo "Rejected dispatch from unexpected source repository: ${{ github.event.client_payload.source_repository }}"
              exit 1
            fi

            operation="${{ github.event.client_payload.operation }}"
            source_ref="${{ github.event.client_payload.source_ref }}"
            prerelease="${{ github.event.client_payload.is_prerelease }}"

            if [[ "${operation}" == "push-sync" || "${operation}" == "manual-dispatch" ]]; then
              operation="push-sync"
              source_ref="main"
              docs_ref="${DOCS_SOURCE_BRANCH}"
              version_label="${DEV_VERSION}"
              alias_to_update="${DEV_VERSION}"
            elif [[ "${operation}" == "release" || "${operation}" == "release-tag" ]]; then
              docs_ref="docs-${source_ref}"
              version_label="${source_ref}"
              update_latest_alias="true"
              if [[ "${prerelease}" == "true" ]]; then
                alias_to_update="${PRERELEASE_ALIAS}"
              else
                alias_to_update="${STABLE_ALIAS}"
                update_default="true"
              fi
            else
              echo "Unsupported repository_dispatch operation: ${operation}"
              exit 1
            fi
          else
            operation="${{ inputs.operation }}"
            source_ref="${{ inputs.source_ref }}"
            docs_ref="${DOCS_SOURCE_BRANCH}"

            if [[ "${operation}" == "backfill" ]]; then
              if [[ -n "${{ inputs.docs_ref }}" ]]; then
                docs_ref="${{ inputs.docs_ref }}"
              else
                docs_ref="docs-${source_ref}"
              fi
              if [[ -n "${{ inputs.version_label }}" ]]; then
                version_label="${{ inputs.version_label }}"
              else
                version_label="${source_ref##*/}"
              fi
            elif [[ "${operation}" == "dry-run" ]]; then
              push_to_pages="false"
              if [[ -n "${{ inputs.docs_ref }}" ]]; then
                docs_ref="${{ inputs.docs_ref }}"
              else
                docs_ref="${DOCS_SOURCE_BRANCH}"
              fi
              if [[ -n "${{ inputs.version_label }}" ]]; then
                version_label="${{ inputs.version_label }}"
              else
                version_label="${DEV_VERSION}"
              fi
              alias_to_update="${DEV_VERSION}"
            elif [[ "${operation}" == "alias-repair" || "${operation}" == "rollback" ]]; then
              :
            else
              echo "Unsupported workflow_dispatch operation: ${operation}"
              exit 1
            fi
          fi

          echo "operation=${operation}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "docs_ref=${docs_ref}" >> "$GITHUB_OUTPUT"
          echo "version_label=${version_label}" >> "$GITHUB_OUTPUT"
          echo "alias_to_update=${alias_to_update}" >> "$GITHUB_OUTPUT"
          echo "update_latest_alias=${update_latest_alias}" >> "$GITHUB_OUTPUT"
          echo "update_default=${update_default}" >> "$GITHUB_OUTPUT"
          echo "push_to_pages=${push_to_pages}" >> "$GITHUB_OUTPUT"

      - name: Enforce strict audit inputs for manual runs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.reason }}" || -z "${{ inputs.change_summary }}" ]]; then
            echo "reason and change_summary are required"
            exit 1
          fi
          if [[ ("${{ inputs.operation }}" == "alias-repair" || "${{ inputs.operation }}" == "rollback") && -z "${{ inputs.target_version }}" ]]; then
            echo "target_version is required for alias-repair and rollback"
            exit 1
          fi

      - name: Checkout docs repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ctx.outputs.docs_ref }}
          path: docs-src
          fetch-depth: 0

      - name: Checkout lexos source ref
        if: ${{ steps.ctx.outputs.operation == 'push-sync' || steps.ctx.outputs.operation == 'release' || steps.ctx.outputs.operation == 'release-tag' || steps.ctx.outputs.operation == 'backfill' || steps.ctx.outputs.operation == 'dry-run' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ env.LEXOS_REPO }}
          ref: ${{ steps.ctx.outputs.source_ref }}
          path: source
          fetch-depth: 0

      - name: Checkout lexos main for alias operations
        if: ${{ steps.ctx.outputs.operation == 'alias-repair' || steps.ctx.outputs.operation == 'rollback' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ env.LEXOS_REPO }}
          ref: main
          path: source
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync docs tooling dependencies
        working-directory: docs-src
        run: uv sync --group dev --no-install-project

      - name: Select docs config source (strict guard)
        id: docsctx
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${GITHUB_WORKSPACE}/docs-src/doc_src/zensical.yml" ]]; then
            echo "docs_config_path=doc_src/zensical.yml" >> "$GITHUB_OUTPUT"
          elif [[ -f "${GITHUB_WORKSPACE}/docs-src/doc_src/mkdocs.yml" ]]; then
            echo "docs_config_path=doc_src/mkdocs.yml" >> "$GITHUB_OUTPUT"
          else
            echo "Missing docs config in selected docs ref"
            exit 1
          fi

      - name: Configure git remote for lexos gh-pages
        if: ${{ steps.ctx.outputs.push_to_pages == 'true' }}
        working-directory: docs-src
        shell: bash
        env:
          LEXOS_PAGES_PAT: ${{ secrets.LEXOS_PAGES_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${LEXOS_PAGES_PAT}" ]]; then
            echo "Missing required secret: LEXOS_PAGES_PAT"
            exit 1
          fi
          # actions/checkout injects an auth extraheader using GITHUB_TOKEN.
          # Remove it so pushes use the PAT configured in the pages remote URL.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add pages "https://x-access-token:${LEXOS_PAGES_PAT}@github.com/${LEXOS_REPO}.git" || git remote set-url pages "https://x-access-token:${LEXOS_PAGES_PAT}@github.com/${LEXOS_REPO}.git"
          if ! git ls-remote --heads pages gh-pages >/dev/null 2>&1; then
            echo "Unable to access ${LEXOS_REPO} gh-pages with LEXOS_PAGES_PAT (403/permission failure likely)."
            echo "Verify token repository scope includes ${LEXOS_REPO} and permissions include Contents: Read and write."
            exit 1
          fi

      - name: Configure git identity for mike
        working-directory: docs-src
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync local gh-pages with remote
        if: ${{ steps.ctx.outputs.push_to_pages == 'true' }}
        working-directory: docs-src
        shell: bash
        run: |
          set -euo pipefail
          # Ensure local gh-pages starts from current remote tip to avoid
          # non-fast-forward push failures when remote has newer commits.
          if git ls-remote --heads pages gh-pages >/dev/null 2>&1; then
            git fetch --no-tags pages gh-pages
            if git show-ref --verify --quiet refs/heads/gh-pages; then
              git branch -f gh-pages FETCH_HEAD
            else
              git branch gh-pages FETCH_HEAD
            fi
          fi

      - name: Validate lexos import path
        if: ${{ steps.ctx.outputs.operation == 'push-sync' || steps.ctx.outputs.operation == 'release' || steps.ctx.outputs.operation == 'release-tag' || steps.ctx.outputs.operation == 'backfill' || steps.ctx.outputs.operation == 'dry-run' }}
        working-directory: docs-src
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/source/src
        run: |
          set -euo pipefail
          test -d "${GITHUB_WORKSPACE}/source/src/lexos"
          uv run --no-sync python - <<'PY'
          import lexos
          print(f"lexos import ok: {lexos.__file__}")
          PY

      - name: Deploy dev or release version
        if: ${{ steps.ctx.outputs.operation == 'push-sync' || steps.ctx.outputs.operation == 'release' || steps.ctx.outputs.operation == 'release-tag' || steps.ctx.outputs.operation == 'dry-run' }}
        working-directory: docs-src
        shell: bash
        env:
          MKDOCSTRINGS_PYTHON_PATH: ${{ github.workspace }}/source/src
          PYTHONPATH: ${{ github.workspace }}/source/src
        run: |
          set -euo pipefail
          version="${{ steps.ctx.outputs.version_label }}"
          alias="${{ steps.ctx.outputs.alias_to_update }}"
          cfg="${{ steps.docsctx.outputs.docs_config_path }}"
          push_flag="${{ steps.ctx.outputs.push_to_pages }}"
          deploy_args=(--config-file "${cfg}" --remote pages)
          if [[ "${push_flag}" == "true" ]]; then
            deploy_args+=(--push)
          fi
          if [[ -n "${alias}" && "${alias}" != "${version}" ]]; then
            uv run --no-sync --with mike mike deploy "${deploy_args[@]}" --update-aliases "${version}" "${alias}"
          else
            uv run --no-sync --with mike mike deploy "${deploy_args[@]}" "${version}"
          fi

      - name: Deploy manual backfill
        if: ${{ steps.ctx.outputs.operation == 'backfill' }}
        working-directory: docs-src
        shell: bash
        env:
          MKDOCSTRINGS_PYTHON_PATH: ${{ github.workspace }}/source/src
          PYTHONPATH: ${{ github.workspace }}/source/src
        run: |
          set -euo pipefail
          uv run --no-sync --with mike mike deploy --config-file "${{ steps.docsctx.outputs.docs_config_path }}" --remote pages --push "${{ steps.ctx.outputs.version_label }}"

      - name: Ensure default version exists
        if: ${{ steps.ctx.outputs.push_to_pages == 'true' && (steps.ctx.outputs.operation == 'push-sync' || steps.ctx.outputs.operation == 'release' || steps.ctx.outputs.operation == 'release-tag' || steps.ctx.outputs.operation == 'backfill') }}
        working-directory: docs-src
        shell: bash
        run: |
          set -euo pipefail
          cfg="${{ steps.docsctx.outputs.docs_config_path }}"
          if uv run --no-sync --with mike mike list --config-file "${cfg}" | awk 'NR>1 {if ($1 == "*") found=1} END {exit !found}'; then
            exit 0
          fi
          target="${{ steps.ctx.outputs.alias_to_update }}"
          if [[ -z "${target}" ]]; then
            target="${{ steps.ctx.outputs.version_label }}"
          fi
          uv run --no-sync --with mike mike set-default --config-file "${cfg}" --remote pages --push "${target}"

      - name: Update latest alias
        if: ${{ steps.ctx.outputs.push_to_pages == 'true' && steps.ctx.outputs.update_latest_alias == 'true' }}
        working-directory: docs-src
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync --with mike mike alias --config-file "${{ steps.docsctx.outputs.docs_config_path }}" --remote pages --push "${{ steps.ctx.outputs.version_label }}" latest

      - name: Apply alias repair
        if: ${{ steps.ctx.outputs.push_to_pages == 'true' && steps.ctx.outputs.operation == 'alias-repair' }}
        working-directory: docs-src
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync --with mike mike alias --config-file "${{ steps.docsctx.outputs.docs_config_path }}" --remote pages --push "${{ inputs.target_version }}" "${{ inputs.alias_name }}"
          if [[ "${{ inputs.alias_name }}" == "stable" ]]; then
            uv run --no-sync --with mike mike set-default --config-file "${{ steps.docsctx.outputs.docs_config_path }}" --remote pages --push stable
          fi

      - name: Apply rollback
        if: ${{ steps.ctx.outputs.push_to_pages == 'true' && steps.ctx.outputs.operation == 'rollback' }}
        working-directory: docs-src
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync --with mike mike alias --config-file "${{ steps.docsctx.outputs.docs_config_path }}" --remote pages --push "${{ inputs.target_version }}" stable
          uv run --no-sync --with mike mike set-default --config-file "${{ steps.docsctx.outputs.docs_config_path }}" --remote pages --push stable

      - name: Publish run summary
        shell: bash
        run: |
          {
            echo "## Versioned Docs Receiver Summary"
            echo ""
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Source repository: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_repository || github.repository }}"
            echo "- Operation: ${{ steps.ctx.outputs.operation }}"
            echo "- Source ref: ${{ steps.ctx.outputs.source_ref }}"
            echo "- Docs ref: ${{ steps.ctx.outputs.docs_ref }}"
            echo "- Docs config path: ${{ steps.docsctx.outputs.docs_config_path }}"
            echo "- Version label: ${{ steps.ctx.outputs.version_label }}"
            echo "- Alias updated: ${{ steps.ctx.outputs.alias_to_update }}"
            echo "- Updated latest alias: ${{ steps.ctx.outputs.update_latest_alias }}"
            echo "- Push to gh-pages: ${{ steps.ctx.outputs.push_to_pages }}"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "- Reason: ${{ inputs.reason }}"
              echo "- Change summary: ${{ inputs.change_summary }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
