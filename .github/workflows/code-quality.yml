name: Code Quality
on:
  push:
    paths:
      - 'doc_src/**'
      - '.github/workflows/code-quality.yml'
  pull_request:
    paths:
      - 'doc_src/**'
      - '.github/workflows/code-quality.yml'

jobs:
  docs_file_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Check YAML files in doc_src
        run: |
          find doc_src \( -name "*.yml" -o -name "*.yaml" \) -type f | xargs -r pre-commit run check-yaml --files
      - name: Check end-of-file fixer in doc_src
        run: |
          git ls-files 'doc_src/**' | xargs -r pre-commit run end-of-file-fixer --files
      - name: Check trailing whitespace in doc_src
        run: |
          git ls-files 'doc_src/**' | xargs -r pre-commit run trailing-whitespace --files
