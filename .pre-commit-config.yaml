repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
    args: ['--unsafe']
    files: ^src/
    exclude: ^src/docs/tutorials/language_model/
  - id: end-of-file-fixer
    files: ^src/
    exclude: ^src/docs/tutorials/language_model/
  - id: trailing-whitespace
    files: ^src/
    exclude: ^src/docs/tutorials/language_model/
