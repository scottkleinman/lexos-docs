[project]
name = "lexos_documentation"
version = "0.2.0b0"
description = "Documentation for the Lexos Python library."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Scott Kleinman", email = "scott.kleinman@csun.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
]

[tool.uv]
package = false
default-groups = ["docs-ci"]

[dependency-groups]
docs-ci = [
    "ipykernel>=6.29.5",
    "mike>=2.1.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-autorefs>=1.4.3",
    "mkdocs-section-index>=0.3.10",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocstrings[python]>=1.0.0",
    "griffe-pydantic>=1.1.8",
    "nbconvert>=7.17.1",
    "pip>=24.3.1",
    "pre-commit>=4.5.0",
    "pymdown-extensions>=11.0.1",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"
