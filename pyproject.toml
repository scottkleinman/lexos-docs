[project]
name = "lexos_documentation"
version = "0.1.0b31"
description = "Documentation for the Lexos Python library."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Scott Kleinman", email = "scott.kleinman@csun.edu" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
docs-ci = [
    "mike>=2.1.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-autorefs>=1.4.3",
    "mkdocs-section-index>=0.3.10",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocstrings[python]>=1.0.0",
    "griffe-pydantic>=1.1.8",
    "pymdown-extensions>=11.0.1",
    "tabulate>=0.9.0",
]

dev = [
    "pip>=24.3.1",
    "mike>=2.1.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-autorefs>=1.4.3",
    "mkdocs-section-index>=0.3.10",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocstrings[python]>=1.0.0",
    "griffe-pydantic>=1.1.8",
    "pymdown-extensions>=11.0.1",
    "tabulate>=0.9.0",
    "ipykernel>=6.29.5",
    "pre-commit>=4.5.0",
    "nbconvert>=7.17.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = ["--import-mode=importlib", ]
filterwarnings = [
    # seaborn 0.13.x internally passes vert= to matplotlib's boxplot, which
    # matplotlib 3.10+ deprecated. This is a seaborn bug, not a Lexos issue.
    "ignore::PendingDeprecationWarning:seaborn",
]

[tool.uv]
override-dependencies = [
    "urllib3>=2.7.0",  # Address vulnerabilities in third-party libraries
    "pillow>=12.3.0",
    "soupsieve>=2.8.4",
    "GitPython>=3.1.55",
    "setuptools>=83.0.0",
    "orjson>=3.11.6",
    "lxml>=6.1.0",
    "tornado>=6.5.7",
    "fonttools>=4.60.2"
]

[tool.ruff.lint]
# Enable all `pydocstyle` rules, limiting to those that adhere to the
# Google convention via `convention = "google"`, below.
select = ["D"]

# Disable `D417`, which requires documentation for every function parameter.
# Just in case -- we can always add it later.
ignore = ["D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Do not require documentation for docstring args in the `tests/` directory.
"!tests/**.py" = ["D417"]
