[project]
name = "lexos-docs"
version = "0.2.0b"
description = "Documentation for the Lexos Python library."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Scott Kleinman", email = "scott.kleinman@csun.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "ruff>=0.16.0",
    "tk>=0.1.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "tabulate>=0.9.0",
    "pymdown-extensions>=11.0.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-autorefs>=1.4.3",
    "mkdocs-section-index>=0.3.10",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocstrings[python]>=1.0.0",
    "griffe-pydantic>=1.1.8",
    "ipykernel>=6.29.5",
    "pre-commit>=4.5.0",
    "nbconvert>=7.17.1",
]

[tool.ruff.lint]
# Enable all `pydocstyle` rules, limiting to those that adhere to the
# Google convention via `convention = "google"`, below.
select = ["D"]

# Disable `D417`, which requires documentation for every function parameter.
# Just in case -- we can always add it later.
ignore = ["D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"
